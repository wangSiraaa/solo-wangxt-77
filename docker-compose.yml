services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
      POSTGRES_DB: splitguard
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://split:split@db:5432/splitguard
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api]
